global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: ql-api
    metrics_path: /metrics
    static_configs:
      # ql-api (deploy/api/deploy.sh) publishes no host port at all -- it's
      # only reachable by container name on the `mcbots_bots` network, which
      # this prometheus container now joins too (docker-compose.yml). Real
      # default for the real VPS topology; override via QL_API_TARGET in
      # this directory's .env for anything else (local dev, a different
      # host).
      - targets: ["${QL_API_TARGET:-ql-api:8000}"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
