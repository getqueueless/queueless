global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: ql-api
    metrics_path: /metrics
    static_configs:
      # Literal target, not `${QL_API_TARGET:-...}` -- found live on the
      # VPS: Prometheus's own YAML config has no env-var substitution at
      # all (that syntax is Docker Compose's, for docker-compose.yml
      # itself, not something Prometheus expands in files it reads), so
      # ql-api showed permanently DOWN with that literal string as the
      # target. ql-api (deploy/api/deploy.sh) publishes no host port at
      # all -- it's only reachable by container name on the `mcbots_bots`
      # network, which this prometheus container joins too
      # (docker-compose.yml). For local dev against a differently-
      # reachable server, edit this line directly.
      - targets: ["ql-api:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
