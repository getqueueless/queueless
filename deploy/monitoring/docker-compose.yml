# Queueless monitoring stack: Prometheus + Grafana + postgres_exporter + Alertmanager.
# Deliberately separate compose project (`queueless-monitoring`, not `queueless`) from
# supabase/docker-compose.yml -- this stack observes the app, it isn't part of it.
#
# Memory budget, <=384MB total (this hackathon's constraint, not a real-world minimum):
#   prometheus 180m + grafana 150m + postgres_exporter 24m + alertmanager 30m = 384m.
# Kept low with a short Prometheus retention (7d) and a 30s scrape interval, not by
# under-provisioning anything below what it needs to actually run.
name: queueless-monitoring

# Every host port below binds 127.0.0.1 only -- Prometheus and Alertmanager have no
# login of their own, so 0.0.0.0 would put them straight on the public internet on a
# shared VPS. Grafana additionally joins the external `mcbots_bots` network (the same
# one ql-api/ql-web already use, see deploy/api/deploy.sh) so Caddy can reverse-proxy
# it at an admin-only URL without any host port at all; its 127.0.0.1 bind stays too,
# for a plain SSH-tunnel fallback. postgres_exporter and alertmanager publish no host
# port -- nothing outside this compose project needs to reach them directly, only
# Prometheus does, over the default project network every service here already
# shares.
networks:
  mcbots_bots:
    external: true
  queueless_default:
    external: true

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: queueless-prometheus
    restart: unless-stopped
    mem_limit: 180m
    networks:
      - default
      - mcbots_bots   # to scrape ql-api:8000, see prometheus.yml's QL_API_TARGET
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: queueless-postgres-exporter
    restart: unless-stopped
    mem_limit: 24m
    networks:
      - default
      - queueless_default   # to reach supabase-db:5432
    environment:
      # Read-only role, not queueless_api and not postgres -- see
      # docs/DECISIONS.md for the exact CREATE ROLE/GRANT the DB agent needs
      # to add. DATA_SOURCE_NAME is never committed; set it in this
      # directory's own .env (gitignored) or the deploy session's secrets.
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: queueless-alertmanager
    restart: unless-stopped
    mem_limit: 30m
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      # Real SMTP creds for noreply@lpu.lol -- never committed, same .env
      # convention as everything else in this repo.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: queueless-grafana
    restart: unless-stopped
    mem_limit: 150m
    depends_on:
      - prometheus
    networks:
      - default
      - mcbots_bots   # so Caddy can proxy queueless-grafana:3000 directly
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Admin-only URL per the task -- the deploy session puts this behind
      # Caddy with its own auth/allowlist; Grafana itself still needs a real
      # admin password, never the image's default. Never committed.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:
